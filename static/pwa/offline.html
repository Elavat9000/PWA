<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17604e">
    <title>Sin conexión · DriveSmart</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;background:#f6f5ef;color:#162e2c;font:18px/1.6 'Segoe UI',Arial,sans-serif}
        main{max-width:680px;width:90%;margin:12vh auto}
        .brand{font-size:26px;font-weight:800;color:#17604e}
        h1{font-size:clamp(36px,8vw,56px);line-height:1.1;letter-spacing:-.03em;margin:48px 0 24px}
        p{max-width:55ch}
        a{display:inline-block;background:#17604e;color:white;text-decoration:none;padding:14px 22px;border-radius:5px;margin-top:16px}
        a:focus-visible{outline:3px solid #a44c12;outline-offset:4px}
        small{display:block;margin-top:28px;color:#53645e;font-size:14px}
    </style>
</head>
<body>
<main>
    <p class="brand">DriveSmart</p>
    <h1>Necesitamos conexión.</h1>
    <p>DriveSmart necesita conexión a internet para consultar vehículos, gestionar rentas y utilizar el asistente.</p>
    <a href="/">Volver a intentar</a>
    <small>Esta pantalla es informativa. No se guardan rentas, datos de usuarios ni conversaciones para usarlos sin conexión.</small>
</main>
</body>
</html>
